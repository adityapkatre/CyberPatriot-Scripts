# --- SSH Service Vulnerabilities ---

[[check]]
message = "SSH is configured to deny root login"
points = 2
    [[check.pass]]
    type='FileContainsRegex'
    path='/etc/ssh/sshd_config'
    value='^[[:space:]]*PermitRootLogin[[:space:]]*no'
    [[check.passoverride]]
    type='FileContainsRegex'
    path='/etc/ssh/sshd_config'
    value='^[[:space:]]*PermitRootLogin[[:space:]]*No'

[[check]]
message = "SSH public key has been created for user 'syme'"
points = 2
    [[check.pass]]
    type = "PathExists"
    path = "/home/syme/.ssh/id_rsa*"

[[check]]
message = "SSH is configured to deny the 'brotherhood' group"
points = 2
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/etc/ssh/sshd_config"
    value = "^[[:space:]]*DenyGroups[[:space:]]+.*brotherhood"

[[check]]
message = "SSH is configured to disallow password authentication"
points = 2
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/etc/ssh/sshd_config"
    value = "^[[:space:]]*PasswordAuthentication[[:space:]]+no"
    [[check.passoverride]]
    type = "FileContainsRegex"
    path = "/etc/ssh/sshd_config"
    value = "^[[:space:]]*PasswordAuthentication[[:space:]]+No"

[[check]]
message = "SSH banner no longer contains sensitive information"
points = 2
    [[check.pass]]
    type = "FileContainsRegexNot" # Checks the default banner file
    path = "/etc/issue.net"
    value = "Ubuntu" # Assumes 'Ubuntu' is the sensitive info
    [[check.passoverride]]
    type = "FileContainsRegex" # Or, check if the Banner is commented out
    path = "/etc/ssh/sshd_config"
    value = "^[[:space:]]*#[[:space:]]*Banner*"

[[check]]
message = "Permissions fixed for multiple SSH configuration directories"
points = 2
    [[check.pass]]
    type = "PermissionIsNot"
    path = "/home/syme/.ssh"
    value = "????????w?" # Checks for 700 (rwx------)
    [[check.pass]]
    type = "PermissionIsNot" # For /etc/ssh
    path = "/etc/ssh"
    value = "????????w?"

# --- Apache Service Vulnerabilities ---

[[check]]
message = "Apache server signature has been disabled"
points = 2
    [[check.pass]]
    type = "DirContainsRegex" # Recursively checks /etc/apache2/
    path = "/etc/apache2/"
    value = "^[[:space:]]*ServerSignature[[:space:]]+Off"

[[check]]
message = "Unauthorized Apache site has been removed"
points = 2
    [[check.pass]]
    type = "PathExistsNot"
    path = "/etc/apache2/sites-enabled/001-db.conf" # e.g., 001-malicious.conf
    [[check.pass]]
    type = "PathExistsNot"
    path = "/var/lib/db/index.html" # e.g., 001-malicious.conf

[[check]]
message = "Apache HTTP TRACE method has been disabled"
points = 2
    [[check.pass]]
    type = "DirContainsRegex"
    path = "/etc/apache2/"
    value = "^[[:space:]]*TraceEnable[[:space:]]+Off"

[[check]]
message = "Apache WebDAV modules have been disabled"
points = 2
    [[check.pass]]
    type = "PathExistsNot"
    path = "/etc/apache2/mods-enabled/dav.load" # Symlink created by 'a2enmod dav'
    [[check.pass]]
    type = "PathExistsNot"
    path = "/etc/apache2/mods-enabled/dav_fs.load" # Symlink created by 'a2enmod dav_fs'

[[check]]
message = "Permissions fixed for Apache configuration file"
points = 2
    [[check.pass]]
    type = "PermissionIsNot"
    path = "/etc/apache2/envvars"
    value = "????????w?" # Should be 644

[[check]]
message = "Bluetooth kernel module has been disabled"
points = 2
    [[check.pass]]
    type = "DirContainsRegex"
    path = "/etc/modprobe.d/"
    value = "^[[:space:]]*blacklist[[:space:]]+bluetooth" # Checks for blacklisting

[[check]]
message = "robots.txt has been created and configured"
points = 2
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/var/www/html/robots.txt"
    value = "User-agent:[[:space:]]*\\*"
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/var/www/html/robots.txt"
    value = "Disallow:[[:space:]]*/admin/*"

