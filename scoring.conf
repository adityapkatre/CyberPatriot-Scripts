# --- Header Configuration ---
# This section defines the basic parameters for the image.
# Replace placeholders with specific details for your round.
name = "Linux TR4"
title = "Linux Team Round 4"
os = "Ubuntu 24.04"
user = "smith" # Main user for notifications
remote = "https://scoring.cyberaegis.tech"
password = "" # Password for remote scoring
local = false
version = "2.1.1" # Aeacus version

# --- Forensics Questions ---
# These checks look for the correct answers in text files on the user's desktop.

[[check]]
message = "Forensics Question 1 correct"
points = 8
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/home/smith/Desktop/FQ1.txt"
    value = "ANSWER:[[:space:]]+b5c7f07a7aa1e101d84c568ba985760181e179df"

[[check]]
message = "Forensics Question 2 correct"
points = 8
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/home/smith/Desktop/FQ2.txt"
    value = "ANSWER:[[:space:]]+exec,suid"

[[check]]
message = "Forensics Question 3 correct"
points = 8
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/home/smith/Desktop/FQ3.txt"
    value = "ANSWER:[[:space:]]+FLAG{i_love_csa}"

# --- User and Group Vulnerabilities ---

[[check]]
message = "Group 'brotherhood' created with appropriate users"
points = 2
    [[check.pass]]
    type = "UserInGroup"
    user = "julia"
    group = "brotherhood"
    [[check.pass]]
    type = "UserInGroup"
    group = "goldstein"
    [[check.pass]]
    type = "UserInGroup"
    group = "smith"

[[check]]
message = "Unauthorized user 'micah' removed"
points = 2
    [[check.pass]]
    type = "UserExistsNot"
    user = "micah"

[[check]]
message = "User 'bigbrother' is no longer a root user"
points = 2
    [[check.pass]]
    type = "UserInGroupNot"
    user = "bigbrother"
    group = "sudo"
    [[check.pass]]
    type = "UserInGroupNot"
    user = "bigbrother"
    group = "adm"

[[check]]
message = "Unauthorized user 'thoughtpolice' removed"
points = 2
    [[check.pass]]
    type = "UserExistsNot"
    user = "thoughtpolice"

[[check]]
message = "Insecure password for 'charrington' has been changed"
points = 2
    [[check.pass]]
    type = "PasswordChanged"
    user = "charrington"
    value = "$y$j9T$GBLo.efCKPgAhnrYdek131$8OSdsuJGPK/Zi/b1wFG0iy3IZhgfzCWY7RSlFR/a5K0" # e.g., '$6$...'

[[check]]
message = "User 'syme' has a secure maximum password age"
points = 2
    [[check.pass]]
	type='CommandNot'
	cmd='chage -l syme | grep "Maximum number of days between password change" | cut -d: -f2 | tr -d "[:blank:]" | grep -q 9999'

[[check]]
message = "Login shell for 'mail' user has been secured"
points = 2
    [[check.pass]]
    type = "CommandOutput"
    cmd = "getent passwd mail | cut -d: -f7"
    value = "/usr/sbin/nologin"
    [[check.passoverride]]
    type = "CommandOutput"
    cmd = "getent passwd mail | cut -d: -f7"
    value = "/bin/false"

[[check]]
message = "A default minimum password age has been configured"
points = 2
	[[check.pass]]
	type="FileContainsRegex"
	path="/etc/login.defs"
	value="PASS_MIN_DAYS[[:space:]]+([1-3][0-9]|[5-9])"

[[check]]
message = "Dictionary-based password strength checks enabled"
points = 2
    # Either the package is installed, or PAM references it in common-password
    [[check.passoverride]]
    type = "ProgramInstalled"
    name = "libpam-pwquality"
    value = '1.4.5-3build1'

[[check]]
message = "Insecure sudo configurations have been fixed"
points = 2
    [[check.pass]]
    type = "FileContainsRegexNot"
    path = "/etc/sudoers"
    value = "NOPASSWD"
    [[check.pass]]
    type = "DirContainsRegexNot"
    path = "/etc/sudoers.d/"
    value = "NOPASSWD"

# --- System and Filesystem Vulnerabilities ---

[[check]]
message = "filesystem configuration fixed"
points = 2
    [[check.pass]]
    type = "FileContainsRegexNot"
    path = "/etc/fstab"
    value = "suid"


[[check]]
message = "Uncomplicated Firewall (UFW) has been enabled"
points = 6
    [[check.pass]]
    type = "FirewallUp"

[[check]]
message = "System is configured to check for updates daily"
points = 2
    [[check.pass]]
    type = "AutoCheckUpdatesEnabled"

[[check]]
message = "Fixed permissions for /etc/shadow"
points = 2
    [[check.pass]]
    type='PathExists'
    path='/etc/shadow'

    [[check.pass]]
    type='PermissionIsNot'
    path='/etc/shadow'
    value = '????r??r??'

[[check]]
message = "Fixed permissions for /etc/cron.d"
points = 2
    [[check.pass]]
    type='PathExists'
    path='/etc/cron.d/'

    [[check.pass]]
    type='PermissionIsNot'
    path='/etc/cron.d/'
    value = '????r??r??'

[[check]]
message = "Malicious crontab file has been removed"
points = 2
    [[check.pass]]
    type = "PathExistsNot"
    path = "/etc/cron.hourly/bigbrother" # e.g., /etc/cron.d/bigbrother
    [[check.passoverride]]
    type = "CommandOutput"
    cmd = "/etc/cron.hourly/bigbrother || echo 'is empty'"
    value = "is empty"

[[check]]
message = "Malicious 'bigbrother' script has been removed"
points = 2
    [[check.pass]]
    type = "PathExistsNot"
    path = "/usr/local/bin/bigbrother.sh"

[[check]]
message = "Disallowed software tool has been removed"
points = 2
    [[check.pass]]
    type = "PathExistsNot"
    path = "/srv/INSTA-OSINT-main/instaOSINT.py" # Placeholder path

[[check]]
message = "Ctrl-Alt-Delete reboot shortcut has been disabled"
points = 2
    [[check.pass]]
    type = "CommandOutput"
    cmd = "readlink /etc/systemd/system/ctrl-alt-del.target"
    value = "/dev/null" # This is created by 'systemctl mask ctrl-alt-del.target'

